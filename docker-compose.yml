services:
  postgres:
    image: postgres:16
    container_name: potterhead-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: potterhead
    volumes:
      - potterhead_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d potterhead"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  potterhead_postgres_data:
